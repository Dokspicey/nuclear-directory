# UI previews: label a PR "preview" and its head is pushed to the `preview`
# branch, which the free nuclear-directory-preview service on Render deploys.
# One preview at a time (#328): while another open PR has the label, a new
# label is taken off again with a comment saying who has the slot. The slot
# frees when that PR merges, closes or loses the label. A push to the PR
# holding it redeploys. The preview runs on its own database and never
# touches production. Runbook: the private backups repo
# (nuclear-directory-backups).
name: Preview

on:
  pull_request:
    types: [labeled, synchronize]

# Runs one at a time; an older run still going is cancelled by a newer one.
concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  PREVIEW_URL: https://nuclear-directory-preview.onrender.com

jobs:
  deploy:
    # Same-repo PRs only, and only while the PR carries the label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      # github.sha is the PR merged into the current main (refs/pull/N/merge),
      # so a stale PR still gets main's fixes, NOINDEX included.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Who holds the slot is read from GitHub, with the jq filter from this
      # checkout (tested in .github/scripts/preview_slot_test.sh).
      - name: Check that the preview slot is free
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          holder="$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=preview&state=open&per_page=100" \
            | jq -r --argjson pr "$PR" -f .github/scripts/preview_holder.jq)"
          if [[ -z "$holder" ]]; then
            echo "free=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "free=false" >> "$GITHUB_OUTPUT"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/preview" > /dev/null || true
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview is in use by #${holder}, so this PR's preview label was taken off and nothing was deployed. Ask the PM for the next turn. The slot frees when #${holder} merges, closes or loses its preview label; then label this PR again."
          echo "::notice::Preview slot held by #${holder}; not deployed."

      - name: Point the preview branch at this PR merged with main
        if: steps.slot.outputs.free == 'true'
        env:
          SHA: ${{ github.sha }}
        run: git push --force origin "${SHA}:refs/heads/preview"

      - name: Comment the link
        if: steps.slot.outputs.free == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview of ${SHA:0:7}, merged with main, is deploying: ${PREVIEW_URL}

          Ready in about 5 minutes. The first visit after a quiet spell takes about a minute to wake it up. It runs on a copy of the seed data, not the live database, and search engines are told to ignore it. No other PR can take the preview until this one merges, closes or loses its preview label."
