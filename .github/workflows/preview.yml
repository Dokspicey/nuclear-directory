# UI previews: label a PR "preview" and its head is pushed to the `preview`
# branch, which the free nuclear-directory-preview service on Render deploys.
# One preview at a time; the most recent label or push wins. The preview runs
# on its own database and never touches production. See docs/previews.md.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize]

# The newest request wins; an older one still running is cancelled.
concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  PREVIEW_URL: https://nuclear-directory-preview.onrender.com

jobs:
  deploy:
    # Same-repo PRs only, and only while the PR carries the label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      # github.sha is the PR merged into the current main (refs/pull/N/merge),
      # so a stale PR still gets main's fixes, NOINDEX included.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Point the preview branch at this PR merged with main
        env:
          SHA: ${{ github.sha }}
        run: git push --force origin "${SHA}:refs/heads/preview"

      - name: Comment the link
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview of ${SHA:0:7}, merged with main, is deploying: ${PREVIEW_URL}

          Ready in about 5 minutes. The first visit after a quiet spell takes about a minute to wake it up. It runs on a copy of the seed data, not the live database, and search engines are told to ignore it. Labelling another PR replaces this preview."
