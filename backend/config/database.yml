# One Postgres database per environment. Solid Queue, Solid Cache and
# Solid Cable keep their tables in it too (see db/migrate), so there is
# only ever one database to run, back up and migrate.
#
# Connection details come from DATABASE_URL (see ../.env.example).
# In development and test the URL has no database name, so the names
# below are used and tests never touch development data.
default: &default
  adapter: postgresql
  encoding: unicode
  # Pool size: DB_POOL if set (production sets 12, since Puma and Solid
  # Queue's threads share this pool in async mode; see config/puma.rb), else
  # RAILS_MAX_THREADS if set, else 5 (Puma itself defaults to 3 threads).
  max_connections: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 5 } } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: nuclear_directory_development

test:
  <<: *default
  database: nuclear_directory_test

# In production DATABASE_URL includes the database name.
production:
  <<: *default
  database: nuclear_directory_production
