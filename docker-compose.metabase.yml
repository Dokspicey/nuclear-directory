# Local Metabase on Tosin's Mac (#111), read-only on production. Not part of
# the app: it never runs on Render, and the app's docker-compose.yml doesn't
# start it. See docs/metabase.md.
#
#   docker compose -f docker-compose.metabase.yml --env-file .env.metabase up -d   # http://localhost:3030
#   docker compose -f docker-compose.metabase.yml --env-file .env.metabase down    # stop (keeps questions)
#
# .env.metabase (gitignored, like every .env.*) holds MB_ENCRYPTION_SECRET_KEY,
# with a copy in the password manager: Metabase encrypts the saved database
# password with it. Without it, Metabase won't start.
name: nuclear-directory-metabase

services:
  metabase:
    image: metabase/metabase:v0.64.1.5
    # Only this Mac can reach it; 3000 is the app.
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # Metabase's own settings and saved questions, in a local file on the
      # volume below. Production data is only ever read over the network.
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?Set MB_ENCRYPTION_SECRET_KEY in .env.metabase (see docs/metabase.md)}
      MB_SITE_URL: http://localhost:3030
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: UTC
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  metabase-data:
